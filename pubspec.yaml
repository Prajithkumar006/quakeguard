name: quakeguard
description: AI-Powered Earthquake Detection, Emergency Response, and Disaster Management Mobile App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  http: ^1.1.0
  provider: ^6.0.5
  audioplayers: ^5.0.0
  geolocator: ^10.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
